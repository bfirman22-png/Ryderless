<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>East vs West — 30 Years of Match Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE — East = red, West = purple.
   ============================================================ */
:root{
  --paper:#E8EAE4; --card:#F7F8F4; --line:#CDD2C8; --line-2:#DDE1D8;
  --ink:#131A17; --ink-2:#5C665F; --ink-3:#8B948C;
  --east:#B2372C; --east-soft:#F2DAD6; --east-deep:#7E2620;
  --west:#6B3FA0; --west-soft:#E2D9F0; --west-deep:#48296E;
  --halve:#8A8F86; --brass:#C29A16; --brass-soft:#F3E7B8;
  --r:3px;
  --f-disp:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);
  background-size:34px 34px;background-position:-1px -1px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
a{color:var(--west)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- masthead ---------- */
header.mast{border-bottom:2px solid var(--ink);background:var(--card)}
.mast-in{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;padding:22px 0 16px}
.title{flex:1 1 320px}
.title h1{font-size:clamp(30px,5.2vw,54px)}
.title h1 .e{color:var(--east)} .title h1 .w{color:var(--west)}
.title p{margin:8px 0 0;color:var(--ink-2);font-size:13.5px;max-width:52ch}
.tally{display:flex;gap:0;border:1px solid var(--line);background:var(--paper)}
.tally div{padding:9px 15px;border-right:1px solid var(--line);text-align:center;min-width:66px}
.tally div:last-child{border-right:0}
.tally b{display:block;font-family:var(--f-disp);font-size:25px;line-height:1;font-weight:800}
.tally span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- nav ---------- */
nav.tabs{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--ink);
  box-shadow:0 1px 0 rgba(19,26,23,.06)}
.tabs-in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:13px 16px;border:0;border-right:1px solid var(--line-2);background:none;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;position:relative;font-weight:500}
.tab:hover{background:var(--paper);color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);background:var(--paper)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brass)}
.tab:focus-visible{outline:2px solid var(--west);outline-offset:-3px}

main{padding:26px 0 70px}
.view{display:none} .view.on{display:block}
.sec{margin-bottom:34px}
.sec>h2{font-size:20px;margin-bottom:3px}
.sec>.sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}

/* ---------- panels & tables ---------- */
.panel{background:var(--card);border:1px solid var(--line)}
.panel-hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.panel-hd h3{font-size:14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);background:var(--card);position:sticky;top:0;border-bottom:1px solid var(--ink);font-weight:600}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.s[data-dir]::after{content:" ▾";color:var(--brass)}
th.s[data-dir=asc]::after{content:" ▴"}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--paper)}
tbody tr.clik{cursor:pointer}
.name{font-weight:600}
.pill{display:inline-block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border:1px solid currentColor;border-radius:var(--r);vertical-align:1px}
.p-e{color:var(--east)} .p-w{color:var(--west)} .p-h{color:var(--halve)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:0}
.d-e{background:var(--east)} .d-w{background:var(--west)}
.tag-act{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:var(--r);
  background:var(--brass-soft);color:#6B540A;border:1px solid #E0CD7A}

/* ---------- bar in table ---------- */
.bar{position:relative;height:6px;background:var(--line-2);border-radius:2px;min-width:70px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);display:block}

/* ---------- controls ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:14px;
  padding:13px 14px;background:var(--card);border:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=search],input[type=text]{font-family:var(--f-body);font-size:13.5px;padding:6px 8px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--r);min-width:130px}
select:focus,input:focus{outline:2px solid var(--west);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 10px;border:0;border-right:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.seg button:focus-visible{outline:2px solid var(--west);outline-offset:-2px}
input[type=range]{width:120px;accent-color:var(--west)}
.count{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:auto}
.btn{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;
  border:1px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer;border-radius:var(--r)}
.btn.ghost{background:none;color:var(--ink)}
.btn:hover{background:var(--west);border-color:var(--west);color:#fff}

/* ---------- THE RIBBON (signature) ---------- */
.ribbon{background:var(--card);border:1px solid var(--line);padding:16px 14px 8px;position:relative}
.ribbon .rb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.rb-key{display:flex;gap:14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);flex-wrap:wrap}
.rb-key i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
#ribbonSvg{display:block;width:100%;height:auto;overflow:visible}
#ribbonSvg .yr{cursor:pointer}
#ribbonSvg .yr rect.hit{fill:transparent}
#ribbonSvg .yr:hover rect.b{filter:brightness(1.15)}
#ribbonSvg .yr:focus{outline:none}
#ribbonSvg .yr:focus rect.b{stroke:var(--ink);stroke-width:1.5}
#ribbonSvg text{font-family:var(--f-mono);font-size:8.5px;fill:var(--ink-3)}
.rb-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);padding:8px 10px;
  border-radius:var(--r);font-size:12px;line-height:1.35;opacity:0;transition:opacity .12s;z-index:20;max-width:230px}
.rb-tip b{font-family:var(--f-disp);font-size:13px;display:block;margin-bottom:2px}
.rb-tip .s{font-family:var(--f-mono);font-size:11px;color:#D9DCD4}

/* ---------- stat cards ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);padding:14px 15px}
.stat .k{font-family:var(--f-disp);font-size:33px;font-weight:800;line-height:1;letter-spacing:-.03em}
.stat .l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.stat .d{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.45;white-space:normal}
.stat.e{border-left:3px solid var(--east)} .stat.w{border-left:3px solid var(--west)}
.stat.b{border-left:3px solid var(--brass)}

/* ---------- year card ---------- */
.ycard{background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.yhd{padding:15px;border-bottom:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.yhd .yy{font-family:var(--f-disp);font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em}
.yhd .yc{flex:1 1 180px}
.yhd .yc .n{font-family:var(--f-disp);font-size:17px;font-weight:700}
.yhd .yc .m{font-size:12px;color:var(--ink-2)}
.score{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:800;font-size:27px}
.score .e{color:var(--east)} .score .w{color:var(--west)}
.score .dash{color:var(--ink-3);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line-2)}
.meta div{padding:9px 14px;border-right:1px solid var(--line-2);flex:1 1 140px;min-width:130px}
.meta .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.meta .v{font-size:13px;margin-top:2px;white-space:normal}
.dayhd{padding:9px 14px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line-2);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dayhd .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.dayhd .r{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
td.res{font-family:var(--f-mono);font-size:12px;text-align:center;width:96px}
tr.we td.sideE,tr.we td:first-child{font-weight:600}
td.sideE{color:var(--ink)} td.sideW{color:var(--ink)}
tr.win-e td.sideE{color:var(--east-deep);font-weight:600}
tr.win-w td.sideW{color:var(--west-deep);font-weight:600}
tr.win-e td.sideW,tr.win-w td.sideE{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.chip{font-family:var(--f-mono);font-size:11px;padding:5px 9px;border:1px solid var(--line);background:var(--card);
  cursor:pointer;border-radius:var(--r);color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.e[aria-pressed=true]{background:var(--east);border-color:var(--east)}
.chip.w[aria-pressed=true]{background:var(--west);border-color:var(--west)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(19,26,23,.55);display:none;z-index:200;
  align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto}
.ovl.on{display:flex}
.modal{background:var(--card);border:1px solid var(--ink);max-width:760px;width:100%;position:relative}
.modal-hd{padding:16px;border-bottom:1px solid var(--ink);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.modal-hd h2{font-size:25px;flex:1 1 auto}
.xbtn{border:1px solid var(--line);background:var(--paper);font-size:17px;line-height:1;padding:5px 10px;
  cursor:pointer;border-radius:var(--r);color:var(--ink-2)}
.xbtn:hover{background:var(--ink);color:var(--card)}
.modal-bd{padding:0 0 8px}
.mrow{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.mrow div{padding:10px 14px;flex:1 1 108px;border-right:1px solid var(--line-2)}
.mrow .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.mrow .v{font-family:var(--f-disp);font-size:19px;font-weight:700;margin-top:2px}
.msec{padding:13px 14px 4px}
.msec h4{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 8px;font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:13.5px}
.empty b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--ink);margin-bottom:5px}
.note{font-size:12px;color:var(--ink-2);background:var(--brass-soft);border:1px solid #E5D492;
  padding:9px 12px;border-radius:var(--r);margin-bottom:14px;white-space:normal}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--ink-3);font-size:12px;background:var(--card)}
footer a{color:var(--ink-2)}
.wrap-scroll{max-height:min(58vh,540px);overflow-y:auto;border-bottom:1px solid var(--line)}
@media (max-width:640px){
  body{font-size:14.5px}
  .wrap{padding:0 12px}
  .mast-in{padding:16px 0 12px;gap:12px 16px}
  .tally{width:100%}
  .tally div{padding:7px 8px;min-width:0;flex:1}
  .tally b{font-size:19px}
  .tally span{font-size:8.5px;letter-spacing:.06em}
  .yhd .yy{font-size:29px}
  th,td{padding:6px 8px}
  .stat .k{font-size:27px}
  .g2,.g3{grid-template-columns:1fr}
  /* bigger, thumb-friendly tap targets */
  .tab{padding:14px 14px;font-size:11.5px}
  .chip{padding:8px 12px;font-size:12px}
  .seg button{padding:9px 12px;font-size:11px}
  .btn{padding:10px 14px}
  select,input[type=search],input[type=text]{min-width:0;width:100%;padding:9px 10px;font-size:15px}
  input[type=range]{width:100%}
  .ctl{padding:12px}
  .fld{width:100%}
  .ctl>.fld{flex:1 1 100%}
  .ctl>.seg,.ctl>button.btn{flex:0 0 auto}
  .count{margin-left:0;width:100%}
  /* modal fills the screen instead of floating a card */
  .ovl{padding:0}
  .modal{max-width:none;min-height:100%}
  .modal-hd h2{font-size:21px}
  .mrow div{flex:1 1 45%;padding:9px 10px}
  .meta div{flex:1 1 45%}
  /* year header stacks cleanly */
  .yhd{padding:13px}
  .score{font-size:23px}
  /* keep wide tables from forcing the whole page to scroll sideways */
  .wrap-scroll{max-height:min(62vh,520px)}
  .xbtn{padding:8px 13px;font-size:19px}
}
@media (max-width:400px){
  .tally div{padding:6px 5px}
  .tally b{font-size:17px}
  .title h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap mast-in">
    <div class="title">
      <h1><span class="e">EAST</span> vs <span class="w">WEST</span></h1>
      <p id="subhead"></p>
    </div>
    <div class="tally" id="tally"></div>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap tabs-in" role="tablist" id="tabbar"></div>
</nav>

<main class="wrap">
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-records"></section>
  <section class="view" id="v-years"></section>
  <section class="view" id="v-pairs"></section>
  <section class="view" id="v-h2h"></section>
  <section class="view" id="v-milestones"></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal"></div>

<script>/* =========================================================================
   East vs West — 30 years of match play
   All figures are computed live from the match log below, so any correction
   to a single match flows through every table on the site.
   ========================================================================= */
(function(){
"use strict";
var D = JSON.parse(document.getElementById('payload').textContent);
var EV = D.events, MA = D.matches, PLS = D.players;
var LAST_YR = EV[EV.length-1].y, NEXT_YR = LAST_YR+1, FIRST_YR = EV[0].y;
var ROSTER_YR = LAST_YR;
PLS.forEach(function(p){ p.att.forEach(function(y){ if(y>ROSTER_YR) ROSTER_YR=y; }); });
var FMTS = ['Chapman','Best Ball','Singles'];
var byYear = {}; EV.forEach(function(e){ byYear[e.y]=e; });
var pInfo = {}; PLS.forEach(function(p){ pInfo[p.n]=p; });

/* ---------- helpers ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function el(t,c,h){ var n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function side(m,n){ return m.e.indexOf(n)>-1 ? 'E' : (m.w.indexOf(n)>-1 ? 'W' : null); }
function outcome(m,s){ return m.r==='H' ? 'H' : (m.r===s ? 'W' : 'L'); }
function num(x){ return (Math.round(x*10)/10).toString().replace(/\.0$/,''); }
function pct(p,t){ return t? (100*p/t).toFixed(1)+'%' : '—'; }
function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function rowsOf(v){ return v.W+v.L+v.H; }
function ptsOf(v){ return v.W + 0.5*v.H; }
function blank(){ return {W:0,L:0,H:0}; }
function wlh(v){ return v.W+'–'+v.L+'–'+v.H; }
function fmtScore(m){ return m.m==='Halved' ? 'halved' : m.m; }
function names(a){ return a.join(' & '); }
function playedList(n){ return (pInfo[n]&&pInfo[n].pl)||[]; }
var ALL_PLAYED = (function(){ var s={}; MA.forEach(function(m){ m.e.concat(m.w).forEach(function(n){s[n]=1;}); }); return Object.keys(s).sort(); })();

/* ---------- record engine ---------- */
function record(name, opt){
  opt = opt||{};
  var v = blank(), list = [];
  for (var i=0;i<MA.length;i++){
    var m = MA[i], s = side(m,name);
    if (!s) continue;
    if (opt.fmt && m.f!==opt.fmt) continue;
    if (opt.from && m.y<opt.from) continue;
    if (opt.to && m.y>opt.to) continue;
    var o = outcome(m,s);
    v[o]++; list.push({m:m,s:s,o:o});
  }
  v.n = rowsOf(v); v.pts = ptsOf(v); v.list = list;
  return v;
}
function allRecords(opt){
  var out = {};
  ALL_PLAYED.forEach(function(n){ var r=record(n,opt); if(r.n) out[n]=r; });
  return out;
}
/* one pass, every player, every format — used by the records table */
var SPLITS = (function(){
  var out={};
  MA.forEach(function(m){
    m.e.concat(m.w).forEach(function(n){
      var o=outcome(m,side(m,n));
      var t=out[n]||(out[n]={all:blank(),f:{}});
      t.all[o]++;
      (t.f[m.f]||(t.f[m.f]=blank()))[o]++;
    });
  });
  return out;
})();
function splitOf(n,f){ var t=SPLITS[n]; if(!t) return blank(); return f ? (t.f[f]||blank()) : t.all; }

/* ============================ THE RIBBON ============================ */
function ribbon(target){
  var box = el('div','ribbon');
  box.innerHTML =
    '<div class="rb-head"><div><span class="eyebrow">The margin, year by year</span>'+
    '<div style="font-family:var(--f-disp);font-weight:700;font-size:15px;margin-top:3px">'+
    'Bars rise for an East win, fall for a West win. Height is the winning margin in points.</div></div>'+
    '<div class="rb-key"><span><i style="background:var(--east)"></i>East</span>'+
    '<span><i style="background:var(--west)"></i>West</span>'+
    '<span><i style="background:var(--brass)"></i>Tied</span></div></div>';
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='ribbonSvg';
  var lastYr = LAST_YR, nextYr = NEXT_YR;
  var years = EV.map(function(e){return e.y;}).concat(byYear[nextYr] ? [] : [nextYr]);
  var W=1000, H=190, pad=26, mid=H/2, n=years.length;
  var cw = (W-pad*2)/n, bw = Math.min(cw*0.62, 20);
  var maxM = 13;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Point margin for each event from '+years[0]+' to '+lastYr+', plus the '+nextYr+' event still to be played');
  function mk(t,a){ var e=document.createElementNS('http://www.w3.org/2000/svg',t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  svg.appendChild(mk('line',{x1:pad-6,y1:mid,x2:W-pad+6,y2:mid,stroke:'#131A17','stroke-width':1}));
  var tip = el('div','rb-tip'); box.appendChild(tip);

  years.forEach(function(y,i){
    var e = byYear[y];
    var x = pad + i*cw + (cw-bw)/2;
    var g = mk('g',{'class':'yr',tabindex:0,role:'button'});
    if (!e){
      g.appendChild(mk('rect',{x:x,y:mid-16,width:bw,height:32,fill:'none',stroke:'var(--ink-3)',
        'stroke-width':1,'stroke-dasharray':'3 3','class':'b'}));
      g.setAttribute('aria-label',nextYr+' — not yet played');
    } else {
      var marg = e.ep - e.wp, h = Math.max(3, Math.abs(marg)/maxM*(mid-24));
      var up = marg>0;
      var col = marg===0 ? 'var(--brass)' : (up?'var(--east)':'var(--west)');
      g.appendChild(mk('rect',{x:x,y:marg===0?mid-3:(up?mid-h:mid),width:bw,height:marg===0?6:h,
        fill:col,'class':'b'}));
      g.setAttribute('aria-label',y+' '+e.c+', East '+num(e.ep)+' West '+num(e.wp)+', '+e.win);
    }
    g.appendChild(mk('rect',{'class':'hit',x:pad+i*cw,y:0,width:cw,height:H}));
    var t = mk('text',{x:x+bw/2,y:H-4,'text-anchor':'middle'});
    t.textContent = (i===0 || y%5===0 || y===nextYr) ? y : "'"+String(y).slice(2);
    svg.appendChild(t);
    function show(){
      if(!e){ tip.innerHTML='<b>'+nextYr+' — next up</b><span class="s">Not yet played.</span>'; }
      else {
        tip.innerHTML='<b>'+y+' · '+esc(e.c)+'</b><span class="s">East '+num(e.ep)+' — West '+num(e.wp)+
          ' · '+e.win+(e.wx?'<br>'+esc(e.wx):'')+'</span>';
      }
      var r=g.getBoundingClientRect(), b=box.getBoundingClientRect();
      tip.style.opacity=1;
      var left = r.left-b.left+r.width/2-110;
      tip.style.left = Math.max(6,Math.min(left, b.width-236))+'px';
      tip.style.top = '52px';
    }
    g.addEventListener('mouseenter',show);
    g.addEventListener('focus',show);
    g.addEventListener('mouseleave',function(){ tip.style.opacity=0; });
    g.addEventListener('blur',function(){ tip.style.opacity=0; });
    function go(){ if(e){ go2('years'); setYear(y); } }
    g.addEventListener('click',go);
    g.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go();} });
    svg.appendChild(g);
  });
  box.appendChild(svg);
  target.appendChild(box);
}

/* ============================ OVERVIEW ============================ */
function buildOverview(){
  var v = $('#v-overview'); v.innerHTML='';
  var s = el('div','sec'); ribbon(s); v.appendChild(s);

  var tot={E:0,W:0}, seriesW={East:0,West:0,Tie:0};
  EV.forEach(function(e){ tot.E+=e.ep; tot.W+=e.wp; seriesW[e.win]++; });
  var holes=0, unk=0, to18=0, halves=0, oneUp=0;
  MA.forEach(function(m){ if(m.h){holes+=m.h; if(m.h===18)to18++;} else unk++;
    if(m.r==='H')halves++; if(m.m==='1 up')oneUp++; });

  var g = el('div','sec');
  var hasUpcoming = ROSTER_YR > LAST_YR;
  g.innerHTML = '<h2>Where it stands</h2><p class="sub">'+EV.length+' events played'+
    (hasUpcoming?'. The '+ROSTER_YR+' field is set.':'.')+'</p>';
  var cards = el('div','grid g3');
  [ ['e', num(tot.E), 'East points all-time', seriesW.East+' event wins'],
    ['w', num(tot.W), 'West points all-time', seriesW.West+' event wins'],
    ['b', num(tot.E-tot.W), 'East&rsquo;s all-time cushion', 'Out of '+num(tot.E+tot.W)+' points contested'],
    ['', MA.length.toLocaleString(), 'Matches played', halves+' of them halved'],
    ['', holes.toLocaleString(), 'Holes played', unk+' matches have no margin recorded'],
    ['', to18, 'Matches that went to 18', pct(to18, MA.length-unk)+' of all matches'] ]
    .forEach(function(c){
      cards.appendChild(el('div','stat '+c[0],'<div class="k">'+c[1]+'</div><div class="l">'+c[2]+'</div><div class="d">'+c[3]+'</div>'));
    });
  g.appendChild(cards); v.appendChild(g);
  if(hasUpcoming) v.appendChild(fieldSection());

  /* format splits */
  var fs = el('div','sec');
  fs.innerHTML='<h2>By format</h2><p class="sub">Chapman opens the modern three-day event, best ball follows, singles decides it.</p>';
  var ft={}; FMTS.forEach(function(f){ ft[f]={E:0,W:0,n:0}; });
  MA.forEach(function(m){ var t=ft[m.f]; if(!t)return; t.n++;
    if(m.r==='H'){t.E+=.5;t.W+=.5;} else if(m.r==='E')t.E++; else t.W++; });
  var p=el('div','panel'), tw=el('div','tw'), tb=el('table');
  tb.innerHTML='<thead><tr><th>Format</th><th class="n">Matches</th><th class="n">East</th><th class="n">West</th><th>Edge</th><th style="width:34%">Share of points</th></tr></thead>';
  var tbody=el('tbody');
  FMTS.forEach(function(f){
    var t=ft[f], share=t.E/(t.E+t.W)*100;
    var r=el('tr');
    r.innerHTML='<td class="name">'+f+'</td><td class="n">'+t.n+'</td><td class="n">'+num(t.E)+'</td><td class="n">'+num(t.W)+
      '</td><td><span class="pill '+(t.E>t.W?'p-e':'p-w')+'">'+(t.E>t.W?'East':'West')+' +'+num(Math.abs(t.E-t.W))+'</span></td>'+
      '<td><div class="bar"><i style="width:'+share.toFixed(1)+'%;background:var(--east)"></i>'+
      '<i style="left:'+share.toFixed(1)+'%;right:0;background:var(--west)"></i></div></td>';
    tbody.appendChild(r);
  });
  tb.appendChild(tbody); tw.appendChild(tb); p.appendChild(tw); fs.appendChild(p); v.appendChild(fs);

  /* courses */
  var cs = el('div','sec');
  cs.innerHTML='<h2>The courses</h2><p class="sub">Fifteen venues. Wildhorse has hosted six times &mdash; and East has never lost there.</p>';
  var cAgg={};
  EV.forEach(function(e){ var c=cAgg[e.c]||(cAgg[e.c]={n:0,E:0,W:0,yrs:[],win:{East:0,West:0,Tie:0}});
    c.n++; c.E+=e.ep; c.W+=e.wp; c.yrs.push(e.y); c.win[e.win]++; });
  var cp=el('div','panel'), ctw=el('div','tw'), ct=el('table');
  ct.innerHTML='<thead><tr><th>Course</th><th class="n">Times</th><th>Years</th>'+
    '<th class="n">East pts</th><th class="n">West pts</th><th>Series</th></tr></thead>';
  var cbody=el('tbody');
  Object.keys(cAgg).sort(function(a,b){ return cAgg[b].n-cAgg[a].n || cAgg[a].yrs[0]-cAgg[b].yrs[0]; })
   .forEach(function(k){ var c=cAgg[k], r=el('tr');
     r.innerHTML='<td class="name">'+esc(k)+'</td><td class="n">'+c.n+'</td>'+
       '<td class="mono" style="font-size:11.5px;color:var(--ink-2)">'+c.yrs.join(' ')+'</td>'+
       '<td class="n">'+num(c.E)+'</td><td class="n">'+num(c.W)+'</td>'+
       '<td class="mono" style="font-size:11.5px">E '+c.win.East+' · W '+c.win.West+(c.win.Tie?' · T '+c.win.Tie:'')+'</td>';
     cbody.appendChild(r); });
  ct.appendChild(cbody); ctw.appendChild(ct); cp.appendChild(ctw); cs.appendChild(cp); v.appendChild(cs);
}


/* ---------- the upcoming field ---------- */
function fieldSection(){
  var s=el('div','sec');
  var nextN = PLS.filter(function(p){ return p.r26; }).length;
  s.innerHTML='<h2>The '+ROSTER_YR+' field</h2><p class="sub">'+nextN+' names are down for '+ROSTER_YR+'. Careers to date, and how many events each will have played once it\u2019s in the books.</p>';
  var sides=[['East','e'],['West','w']];
  var g=el('div','grid g2');
  sides.forEach(function(sd){
    var men=PLS.filter(function(p){ return p.r26 && p.t===sd[0]; })
      .map(function(p){ var r=splitOf(p.n,null);
        return {n:p.n,ev:p.pl.length,m:rowsOf(r),pts:ptsOf(r),wp:rowsOf(r)?ptsOf(r)/rowsOf(r):0,rookie:!rowsOf(r)}; })
      .sort(function(a,b){ return b.ev-a.ev || b.pts-a.pts; });
    var p=el('div','panel');
    p.innerHTML='<div class="panel-hd"><h3><span class="dot d-'+sd[1]+'"></span>'+sd[0]+'</h3>'+
      '<span class="eyebrow">'+men.length+' players</span></div>';
    var tw=el('div','tw'), t=el('table');
    t.innerHTML='<thead><tr><th>Player</th><th class="n">Events</th><th class="n">W\u2013L\u2013H</th><th class="n">Pts</th><th class="n">Win %</th></tr></thead>';
    var b=el('tbody');
    men.forEach(function(r){
      var tr=el('tr','clik'); tr.tabIndex=0;
      tr.innerHTML='<td class="name">'+esc(r.n)+(r.ev===EV.length?' <span class="tag-act">'+ord(r.ev+1)+'</span>':'')+
        (r.rookie?' <span class="pill" style="color:var(--west)">debut</span>':'')+'</td>'+
        '<td class="n">'+(r.ev||'\u2014')+'</td><td class="n">'+(r.m?wlh(splitOf(r.n,null)):'\u2014')+'</td>'+
        '<td class="n"><b>'+(r.m?num(r.pts):'\u2014')+'</b></td>'+
        '<td class="n">'+(r.m?(100*r.wp).toFixed(1)+'%':'\u2014')+'</td>';
      if(r.m){ tr.addEventListener('click',function(){ openPlayer(r.n); });
        tr.addEventListener('keydown',function(e){ if(e.key==='Enter') openPlayer(r.n); }); }
      b.appendChild(tr);
    });
    t.appendChild(b); tw.appendChild(t); p.appendChild(tw); g.appendChild(p);
  });
  s.appendChild(g);
  return s;
}

/* ============================ RECORDS ============================ */
var recState = {fmt:'', team:'all', status:'act', min:1, q:'', sort:'pts', dir:'desc'};
function buildRecords(){
  var v=$('#v-records'); v.innerHTML='';
  var head=el('div','sec');
  head.innerHTML='<h2>Career records</h2><p class="sub">Every player who has hit a shot that counted. Sort any column; click a name for the full card.</p>';
  v.appendChild(head);

  var ctl=el('div','ctl');
  ctl.innerHTML=
   '<div class="fld"><label>Format</label><div class="seg" id="rFmt">'+
     '<button data-v="" aria-pressed="true">All</button><button data-v="Chapman">Chapman</button>'+
     '<button data-v="Best Ball">Best ball</button><button data-v="Singles">Singles</button></div></div>'+
   '<div class="fld"><label>Team</label><div class="seg" id="rTeam">'+
     '<button data-v="all" aria-pressed="true">Both</button><button data-v="East">East</button><button data-v="West">West</button></div></div>'+
   '<div class="fld"><label>Status</label><div class="seg" id="rStat">'+
     '<button data-v="all">Everyone</button><button data-v="act" aria-pressed="true">Active</button><button data-v="ret">Not active</button></div></div>'+
   '<div class="fld"><label>Minimum matches: <span id="rMinV" class="mono">1</span></label>'+
     '<input type="range" id="rMin" min="1" max="60" step="1" value="1"></div>'+
   '<div class="fld"><label>Find a player</label><input type="search" id="rQ" placeholder="name…" autocomplete="off"></div>'+
   '<span class="count" id="rCount"></span>';
  v.appendChild(ctl);

  var note=el('div','note','<b>Active</b> means on the '+ROSTER_YR+' roster. '+
    'Points are 1 for a win, ½ for a halve. Win % is points divided by matches.');
  v.appendChild(note);

  var panel=el('div','panel');
  var scroll=el('div','wrap-scroll');
  var tw=el('div','tw'), tb=el('table'); tb.id='rTable';
  tw.appendChild(tb); scroll.appendChild(tw); panel.appendChild(scroll);
  var ft=el('div',null,'<div style="padding:9px 14px;font-size:12px;color:var(--ink-2)" id="rFoot"></div>');
  panel.appendChild(ft);
  v.appendChild(panel);

  function seg(id,key){ $('#'+id).addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b);});

function renderRecords(){
  var rows=[];

    var r=splitOf(n,recState.fmt||null), tot=rowsOf(r);

    if(recState.status==='act' && !p.act) return;

      first:yrs[0]||'',last:yrs[yrs.length-1]||'',

  });
  var k=recState.sort, d=recState.dir==='asc'?1:-1;
  rows.sort(function(a,b){

    return d*(x-y) || a.n.localeCompare(b.n);
  });
  var showSplit = !recState.fmt;
  var cols=[['n','Player',''],['t','Team',''],['ev','Yrs','n'],['m','Match','n'],
    ['W','W','n'],['L','L','n'],['H','H','n'],['pts','Points','n'],['wp','Win %','n'],['last','Last','n']];

  rows.forEach(function(r){

        (r.act?' <span class="tag-act">active</span>':'')+(r.caps?' <span class="pill" style="color:var(--brass)">C\u00d7'+r.caps+'</span>':'')+'</td>'+
      '<td>'+r.t+'</td><td class="n">'+r.ev+'</td><td class="n">'+r.m+'</td>'+
      '<td class="n">'+r.W+'</td><td class="n">'+r.L+'</td><td class="n">'+r.H+'</td>'+
      '<td class="n"><b>'+num(r.pts)+'</b></td><td class="n">'+(100*r.wp).toFixed(1)+'%</td>'+
      '<td class="n">'+r.last+'</td>'+
      (showSplit?'<td class="n">'+sp(r.ch)+'</td><td class="n">'+sp(r.bb)+'</td><td class="n">'+sp(r.sg)+'</td>':'')+
      '<td><div class="bar"><i style="width:'+(100*r.pts/maxP).toFixed(1)+'%"></i></div></td>';
    tr.addEventListener('click',function(){ openPlayer(r.n); });
    tr.addEventListener('keydown',function(e){ if(e.key==='Enter'){openPlayer(r.n);} });
    body.appendChild(tr);
  });
  tb.appendChild(body);

  $('#rFoot').innerHTML='Showing <b>'+rows.length+'</b> players · '+tm+' player-matches · '+num(tp)+' points'+
    (recState.fmt?' · '+recState.fmt+' only':' · the last three columns are win\u2013loss\u2013halve by format');
  [].forEach.call(tb.querySelectorAll('th.s'),function(th){
    th.addEventListener('click',function(){
      var kk=th.dataset.k;
      if(recState.sort===kk){ recState.dir = recState.dir==='desc'?'asc':'desc'; }
      else { recState.sort=kk; recState.dir=(kk==='n'||kk==='t')?'asc':'desc'; }

  });
}

function renderRivals(){
  var map={};
  MA.forEach(function(m){
    m.e.forEach(function(a){ m.w.forEach(function(b){
      var k=[a,b].sort(), id=k.join('|');
      var t=map[id]||(map[id]={a:k[0],b:k[1],n:0,aw:0,bw:0,h:0,yrs:[]});
      t.n++; t.yrs.push(m.y);
      if(m.r==='H') t.h++;
      else if((m.r==='E'&&m.e.indexOf(t.a)>-1)||(m.r==='W'&&m.w.indexOf(t.a)>-1)) t.aw++;
      else t.bw++;
    }); });
  });
  var rows=Object.keys(map).map(function(k){return map[k];})
    .filter(function(r){ return r.n>=5; })

      '<td class="n" style="color:var(--ink-2)">'+Math.min.apply(null,r.yrs)+'–'+Math.max.apply(null,r.yrs)+'</td>';

  function monthOf(dt){ if(!dt) return null; var m=/^(\d+)\//.exec(dt); return m?+m[1]:null; }
  var july = MA.filter(function(m){ return monthOf(m.dt)===7; });
  var jT={E:0,W:0}; july.forEach(function(m){ if(m.r==='H'){jT.E+=.5;jT.W+=.5;} else if(m.r==='E')jT.E++; else jT.W++; });
  var jYears = Array.from(new Set(july.map(function(m){return m.y;}))).sort();
  var jPts={}, jN={};
  july.forEach(function(m){
    m.e.concat(m.w).forEach(function(n){ jN[n]=(jN[n]||0)+1; });
    m.e.forEach(function(n){ jPts[n]=(jPts[n]||0)+(m.r==='H'?.5:(m.r==='E'?1:0)); });
    m.w.forEach(function(n){ jPts[n]=(jPts[n]||0)+(m.r==='H'?.5:(m.r==='W'?1:0)); });
  });
  var jTop = Object.keys(jPts).map(function(n){ return {n:n,p:jPts[n],m:jN[n]}; })
    .sort(function(a,b){ return b.p-a.p || b.m-a.m; });
  var jLeaders = jTop.filter(function(x){ return x.p===jTop[0].p; });

  var s11=el('div','sec');
  s11.innerHTML='<h2>By month: July vs. August</h2><p class="sub">Most of the calendar has been August, but '+
    july.length+' matches across '+jYears.length+' events ('+jYears.join(', ')+') were played in late July.</p>';
  var g11=el('div','grid g3');
  g11.appendChild(el('div','stat e','<div class="k">'+num(jT.E)+'&ndash;'+num(jT.W)+'</div>'+
    '<div class="l">East&ndash;West record in July</div>'+
    '<div class="d">West holds the edge in the early rounds, '+num(jT.W)+' to '+num(jT.E)+' across '+july.length+' matches.</div>'));
  g11.appendChild(el('div','stat','<div class="k">'+jLeaders.map(function(x){return esc(x.n);}).join(' &amp; ')+'</div>'+
    '<div class="l">Top July point scorer'+(jLeaders.length>1?'s':'')+'</div>'+
    '<div class="d">'+jLeaders.map(function(x){return num(x.p)+' pts in '+x.m+' July matches';}).join('; ')+'.</div>'));
  var augT={E:0,W:0}, augN=0;
  MA.forEach(function(m){ if(monthOf(m.dt)!==7){ augN++; if(m.r==='H'){augT.E+=.5;augT.W+=.5;} else if(m.r==='E')augT.E++; else augT.W++; } });
  g11.appendChild(el('div','stat w','<div class="k">'+num(augT.E)+'&ndash;'+num(augT.W)+'</div>'+
    '<div class="l">East&ndash;West record in August</div>'+
    '<div class="d">The other '+augN+' matches, where East has the slight all-time edge.</div>'));
  s11.appendChild(g11); v.appendChild(s11);

  /* --- for the speech: anomalies --- */
  var s12=el('div','sec');
  s12.innerHTML='<h2>For the speech</h2><p class="sub">Things that turned up along the way that didn&rsquo;t fit anywhere else.</p>';
  var g12=el('div','grid g2');

  var goatCount={};
  EV.forEach(function(e){ e.goats.forEach(function(n){ goatCount[n]=(goatCount[n]||0)+1; }); });
  var topGoat = Object.keys(goatCount).map(function(n){return {n:n,c:goatCount[n]};}).sort(function(a,b){return b.c-a.c;})[0];
  g12.appendChild(el('div','stat','<div class="k">'+esc(topGoat.n)+'</div><div class="l">Most Goat-of-the-Day awards</div>'+
    '<div class="d">'+topGoat.c+' of them &mdash; more than anyone else in '+EV.length+' years.</div>'));

  var wCount={}; EV.forEach(function(e){ var w=(e.wx||'').trim(); if(/^perfect/i.test(w)) wCount.perfect=(wCount.perfect||0)+1; });
  g12.appendChild(el('div','stat','<div class="k">'+(wCount.perfect||0)+' of 29</div><div class="l">Years logged as &ldquo;Perfect&rdquo; weather</div>'+
    '<div class="d">Runner-up conditions: 111&deg; in 2009, and 2025&rsquo;s weather is simply recorded as &ldquo;???&rdquo;.</div>'));

  var switchers = PLS.filter(function(p){ return p.sides.length>1; });
  g12.appendChild(el('div','stat','<div class="k">'+(switchers.length?esc(switchers[0].n):'&mdash;')+'</div>'+
    '<div class="l">Only player to switch sides</div>'+
    '<div class="d">Played West through the early 2000s, then reappeared on East from 2007 on.</div>'));

  var firstNames={}; PLS.forEach(function(p){ var f=p.n.split(' ')[0]; firstNames[f]=(firstNames[f]||0)+1; });
  var maxFN=Math.max.apply(null,Object.values(firstNames));
  var fnLeaders=Object.keys(firstNames).filter(function(f){return firstNames[f]===maxFN;});
  g12.appendChild(el('div','stat','<div class="k">'+maxFN+'-way tie</div><div class="l">Most common first name</div>'+
    '<div class="d">'+fnLeaders.join(', ')+' each belong to '+maxFN+' different players across 30 years.</div>'));

  var margins = MA.filter(function(m){return m.h;}).map(function(m){ return {m:m,up:18-m.h}; });
  var lossesTo = {};
  margins.filter(function(x){return x.up>=6;}).forEach(function(x){
    var loser = x.m.r==='E'?x.m.w:(x.m.r==='W'?x.m.e:[]);
    loser.forEach(function(n){ lossesTo[n]=(lossesTo[n]||0)+1; });
  });
  var blowoutMagnet = Object.keys(lossesTo).map(function(n){return {n:n,c:lossesTo[n]};}).sort(function(a,b){return b.c-a.c;})[0];
  if(blowoutMagnet && blowoutMagnet.c>1){
    g12.appendChild(el('div','stat','<div class="k">'+esc(blowoutMagnet.n)+'</div><div class="l">Most frequent on the losing end of a rout</div>'+
      '<div class="d">On the wrong side of '+blowoutMagnet.c+' of the biggest blowouts in tournament history (6-up or worse).</div>'));
  }

  var noMargin = MA.filter(function(m){ return /not recorded/i.test(m.m||''); });
  g12.appendChild(el('div','stat','<div class="k">'+noMargin.length+'</div><div class="l">Wins with no margin on record</div>'+
    '<div class="d">Someone wrote down who won and forgot to write down by how much &mdash; '+
    noMargin.map(function(m){return m.y;}).join(', ')+'.</div>'));

  var tieYear = EV.filter(function(e){ return e.win==='Tie' && e.ec && /committee/i.test(e.ec); })[0];
  if(tieYear){
    g12.appendChild(el('div','stat','<div class="k">'+tieYear.year+'</div><div class="l">The year nobody could agree on a captain</div>'+
      '<div class="d">East went with &ldquo;Captain By Committee.&rdquo; The event ended in a tie.</div>'));
  }

  s12.appendChild(g12); v.appendChild(s12);
}
function sideList(title,sub,rows){
  var p=el('div','panel');
  p.innerHTML='<div class="panel-hd"><div><h3>'+title+'</h3>'+(sub?'<div style="font-size:11.5px;color:var(--ink-2)">'+sub+'</div>':'')+'</div></div>';
  var tw=el('div','tw'), t=el('table'), b=el('tbody');
  rows.forEach(function(r,i){
    b.appendChild(el('tr',null,'<td class="n" style="color:var(--ink-3);width:26px">'+(i+1)+'</td>'+
      '<td class="name">'+esc(r.n)+'</td><td class="n"><b>'+r.v+'</b></td>'+
      '<td class="n" style="color:var(--ink-2)">'+(r.x||'')+'</td>'));
  });
  t.appendChild(b); tw.appendChild(t); p.appendChild(tw); return p;
}
function leaderTable(rows,heads,lim){
  rows.sort(function(a,b){return b.v-a.v;});
  var p=el('div','panel'), tw=el('div','tw'), t=el('table');
  t.innerHTML='<thead><tr>'+heads.map(function(h,i){return '<th'+(i?' class="n"':'')+'>'+h+'</th>';}).join('')+'</tr></thead>';
  var b=el('tbody');
  rows.slice(0,lim).forEach(function(r){
    b.appendChild(el('tr',null,'<td class="name">'+esc(r.n)+'</td><td class="n"><b>'+r.v+'</b></td>'+
      '<td class="n">'+(r.x||'')+'</td><td class="n">'+(r.p!=null?(100*r.p).toFixed(1)+'%':'')+'</td>'));
  });
  t.appendChild(b); tw.appendChild(t); p.appendChild(tw); return p;
}

/* ============================ CHROME ============================ */
var TABS=[['overview','Overview'],['records','Records'],['years','Year by year'],
  ['pairs','Partnerships'],['h2h','Head to head'],['milestones','30 years']];
function go2(id){
  TABS.forEach(function(t){
    var on = t[0]===id;
    $('#v-'+t[0]).classList.toggle('on',on);
    $('#tab-'+t[0]).setAttribute('aria-selected',on);
  });
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  window.scrollTo({top:0,behavior:'auto'});
}
function boot(){
  var tE=0,tW=0,sw={East:0,West:0,Tie:0};
  EV.forEach(function(e){ tE+=e.ep; tW+=e.wp; sw[e.win]++; });
  var upNow = ROSTER_YR > LAST_YR;
  $('#subhead').innerHTML=EV.length+' events since '+FIRST_YR+' across the Pacific Northwest'+
    (upNow?', and the '+ord(EV.length+1)+' to come in '+ROSTER_YR+'. ':'. ')+
    MA.length.toLocaleString()+' matches, all of them here.';
  $('#tally').innerHTML=
    '<div><b style="color:var(--east)">'+sw.East+'</b><span>East</span></div>'+
    '<div><b style="color:var(--brass)">'+sw.Tie+'</b><span>Tied</span></div>'+
    '<div><b style="color:var(--west)">'+sw.West+'</b><span>West</span></div>'+
    '<div><b>'+num(tE)+'</b><span>E pts</span></div>'+
    '<div><b>'+num(tW)+'</b><span>W pts</span></div>';
  var bar=$('#tabbar');
  TABS.forEach(function(t){
    var b=el('button','tab',t[1]); b.id='tab-'+t[0]; b.setAttribute('role','tab');
    b.setAttribute('aria-selected','false');
    b.addEventListener('click',function(){ go2(t[0]); });
    bar.appendChild(b);
  });
  $('#foot').innerHTML='Built from the <b>Match Summary</b> tab of the club spreadsheet — '+
    MA.length+' matches across '+EV.length+' events, '+FIRST_YR+' to '+LAST_YR+'. All records on this page are '+
    'recalculated from those matches every time the page loads, so correcting one match corrects every table. '+
    'Event point totals reconcile exactly with the Team History tab.'+
    '<br><br>Three matches (2012, 2015 and 2017) are recorded as wins with no margin, so they count in every '+
    'win–loss table but are left out of the holes-played figures.';
  buildOverview(); buildRecords(); buildYears(); buildPairs(); buildH2H(); buildMilestones();
  var h=location.hash.slice(1);
  go2(TABS.some(function(t){return t[0]===h;})?h:'overview');
  $('#ovl').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
}
boot();
})();
</script>
